name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Cargo must shell out to the git CLI so the credential rewrite below is honored
  # when fetching the private NexusCompress git dependency.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  check:
    name: Check · Test · Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Authenticate cargo to private NexusCompress dependency
        env:
          NEXUSCOMPRESS_DEPLOY_KEY: ${{ secrets.NEXUSCOMPRESS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$NEXUSCOMPRESS_DEPLOY_KEY" > ~/.ssh/nexuscompress
          chmod 600 ~/.ssh/nexuscompress
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host github.com\n  IdentityFile ~/.ssh/nexuscompress\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          git config --global \
            url."git@github.com:AutomataNexus/NexusCompress".insteadOf \
            "https://github.com/AutomataNexus/NexusCompress"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings -A clippy::type_complexity -A clippy::should_implement_trait -A clippy::new_without_default -A clippy::manual_checked_ops

      - name: Test
        run: cargo test --workspace
