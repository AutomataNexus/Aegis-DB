name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Cargo must shell out to the git CLI so the credential rewrite below is honored
  # when fetching the private NexusCompress git dependency.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  check:
    name: Check · Test · Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: DIAG private-dep token check (temporary)
        env:
          T1: ${{ secrets.PROJECTOPERATOINS }}
          T2: ${{ secrets.OPERATIONS }}
        run: |
          echo "PROJECTOPERATOINS length: ${#T1}"
          echo "OPERATIONS length: ${#T2}"
          git -c credential.helper= ls-remote "https://x-access-token:${T1}@github.com/AutomataNexus/NexusCompress" HEAD >/dev/null 2>&1 && echo "PROJECTOPERATOINS: AUTH_OK" || echo "PROJECTOPERATOINS: AUTH_FAIL"
          git -c credential.helper= ls-remote "https://x-access-token:${T2}@github.com/AutomataNexus/NexusCompress" HEAD >/dev/null 2>&1 && echo "OPERATIONS: AUTH_OK" || echo "OPERATIONS: AUTH_FAIL"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Authenticate cargo to private NexusCompress dependency
        env:
          NEXUSCOMPRESS_TOKEN: ${{ secrets.PROJECTOPERATOINS }}
        run: |
          git config --global \
            url."https://x-access-token:${NEXUSCOMPRESS_TOKEN}@github.com/AutomataNexus/NexusCompress".insteadOf \
            "https://github.com/AutomataNexus/NexusCompress"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings -A clippy::type_complexity -A clippy::should_implement_trait -A clippy::new_without_default -A clippy::manual_checked_ops

      - name: Test
        run: cargo test --workspace
