# NexusForge release gate for Aegis-DB: run after fmt / clippy / test, before the attested release.
# aegis-gate = cargo audit, aegis-server booted on loopback with a scratch data dir and a one-run admin,
# the query and document-store suite over HTTP, then SIGTERM, a second boot on the same data dir and
# the data read back. Nothing leaves 127.0.0.1.
#
# Audit ignores (--audit-ignore), each with its reason and the follow-up that removes it:
# - RUSTSEC-2025-0141: bincode 1.3 is unmaintained (not a vulnerability). It is the on-disk format of
#   aegis-storage and aegis-timeseries (and NexusCompress), so removing it needs an on-disk-format
#   migration with a reader for existing files. Follow-up: that migration card. Approved 2026-11-01 (NF-138).

[[gate]]
name = "aegis-server binary"
argv = ["cargo", "build", "-j", "{jobs}", "--release", "-p", "aegis-server", "--bin", "aegis-server"]

[[gate]]
name = "aegis-server loopback query + document-store suite + audit"
argv = ["cargo", "run", "-j", "{jobs}", "-p", "aegis-gate", "--", "--bin", "target/release/aegis-server", "--out", "target/nexusforge-gate/aegis", "--audit-ignore", "RUSTSEC-2025-0141"]
